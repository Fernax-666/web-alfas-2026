<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Planilla Mensual (Precartón) | Gestión de Servicios</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=12">
  <script src="js/utils/helpers.js?v=12"></script>
  <script src="js/services/calculator.js?v=12"></script>
  <script src="js/services/database.js?v=12"></script>
  <script src="js/services/storage.js?v=12"></script>
  <script src="js/services/cloudSync.js?v=12"></script>
  <script src="js/precarton.js?v=12"></script>
  <style>
    .planilla-controls {
      display: flex;
      align-items: flex-end;
      gap: 15px;
      flex-wrap: wrap;
    }
    .planilla-controls select, .planilla-controls input {
      width: auto;
      min-width: 150px;
    }
    .planilla-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .planilla-table th {
      background: var(--primary);
      color: white;
      padding: 10px 8px;
      text-align: center;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    .planilla-table td {
      padding: 6px;
      border: 1px solid var(--border);
      text-align: center;
      vertical-align: middle;
    }
    .planilla-table tr:nth-child(even) { background: #f8fafc; }
    .planilla-table tr.finde { background: #fef8f0; }
    .planilla-table tr.finde td:first-child { color: #b45309; font-weight: 700; }
    .planilla-table td:first-child, .planilla-table td:nth-child(2) {
      font-weight: 600;
      background: var(--bg-main);
      white-space: nowrap;
    }
    .planilla-table select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 0.85rem;
      background: white;
    }
    .planilla-table select:focus { border-color: var(--primary); outline: none; }
    .planilla-table select.asignado { background: #eff6ff; border-color: #93c5fd; font-weight: 600; }

    .turno-col-0 { background-color: #f0fdf4; }
    .turno-col-1 { background-color: #eff6ff; }
    .turno-col-2 { background-color: #fffbeb; }
    .turno-col-3 { background-color: #f5f3ff; }
    .turno-col-4 { background-color: #fff1f2; }

    .planilla-table th.turno-header-0 { background-color: #16a34a; }
    .planilla-table th.turno-header-1 { background-color: #2563eb; }
    .planilla-table th.turno-header-2 { background-color: #d97706; }
    .planilla-table th.turno-header-3 { background-color: #7c3aed; }
    .planilla-table th.turno-header-4 { background-color: #e11d48; }

    .nav-btn {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--text-main);
      font-weight: 600;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      min-height: 44px;
      background: #fff;
    }
    .nav-btn:hover { border-color: var(--primary); color: var(--primary); }

    .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; text-align: left; }
    .h1-planilla { font-size: 1.5rem; margin-bottom: 3px; }
    .info-empresa-box { margin-top: 8px; font-size: 0.82rem; color: var(--text-muted); line-height: 1.7; display: none; }
    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .input-year { width: 110px !important; min-width: 110px !important; }

    @media print {
      .no-print, .mobile-bottom-nav { display: none !important; }
      .card { box-shadow: none; border: 1px solid #ccc; }
      .planilla-table select { border: none; appearance: none; background: transparent; }
    }

    @media (max-width: 768px) {
      .header-flex { flex-direction: column; align-items: stretch; }
      .header-actions { width: 100%; }
      .header-actions > * { flex: 1; }
      .planilla-controls { flex-direction: column; align-items: stretch; }
      .planilla-controls .form-group,
      .planilla-controls select,
      .planilla-controls input { width: 100% !important; }
    }
  </style>
</head>
<body>
<div class="container">
  <header class="header-flex">
    <div>
      <h1 class="h1-planilla">Planilla Mensual de Turnos (Precartón)</h1>
      <p class="subtitle" id="subtitulo">Cargando...</p>
      <div id="infoEmpresa" class="info-empresa-box">
        <span id="infoEmpNroSrv"></span>
        <span id="infoEmpDomicilio"></span>
        <span id="infoEmpBarrio"></span>
        <span id="infoEmpTel"></span>
        <br id="brRef" class="display-none">
        <span id="infoEmpRef"></span>
        <span id="infoEmpTelRef"></span>
        <br id="brPol" class="display-none">
        <span id="infoEmpPol"></span>
        <span id="infoEmpTelPol"></span>
      </div>
    </div>
    <div class="no-print header-actions">
      <a href="index.html" class="nav-btn">← Volver al Dashboard</a>
      <button class="btn-outline no-print" onclick="window.print()">🖨️ Imprimir</button>
      <button class="btn-primary no-print" onclick="guardarPlanilla()">💾 Guardar</button>
    </div>
  </header>

  <div class="card no-print">
    <div class="planilla-controls">
      <div class="form-group margin-0">
        <label for="selEmpresa">Empresa</label>
        <select id="selEmpresa" title="Seleccionar Empresa para la planilla" onchange="generarPlanilla()"></select>
      </div>
      <div class="form-group margin-0">
        <label for="selMes">Mes</label>
        <select id="selMes" title="Seleccionar Mes para la planilla" onchange="generarPlanilla()">
          <option value="0">Enero</option><option value="1">Febrero</option>
          <option value="2">Marzo</option><option value="3">Abril</option>
          <option value="4">Mayo</option><option value="5">Junio</option>
          <option value="6">Julio</option><option value="7">Agosto</option>
          <option value="8">Septiembre</option><option value="9">Octubre</option>
          <option value="10">Noviembre</option><option value="11">Diciembre</option>
        </select>
      </div>
      <div class="form-group margin-0">
        <label for="selAnio">Año</label>
        <input type="number" id="selAnio" title="Seleccionar Año para la planilla" aria-label="Año" value="2026" min="2020" max="2040" onchange="generarPlanilla()" class="input-year">
      </div>
      <div class="form-group margin-0">
        <label for="filtroDiaMovil">Filtrar Día (Rápido Móvil)</label>
        <input type="number" id="filtroDiaMovil" title="Filtrar por número de día del mes (1-31)" placeholder="Todos (1-31)" min="1" max="31" oninput="filtrarDiaPlanillaMovil()" class="input-year">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="table-container table-responsive">
      <table class="planilla-table custom-table" id="tablaPlanilla">
        <thead id="cabeceraPlanilla"></thead>
        <tbody id="cuerpoPlanilla"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- BARRA DE NAVEGACIÓN INFERIOR EXCLUSIVA MÓVIL -->
<nav class="mobile-bottom-nav no-print" aria-label="Navegación principal móvil">
  <a href="index.html" class="mobile-nav-btn">
    <span class="nav-icon">📅</span>
    <span>Agenda</span>
  </a>
  <a href="index.html" class="mobile-nav-btn">
    <span class="nav-icon">📊</span>
    <span>Resumen</span>
  </a>
  <a href="index.html" class="mobile-nav-btn">
    <span class="nav-icon">📋</span>
    <span>Historial</span>
  </a>
  <a href="Precarton_Adcionales.html" class="mobile-nav-btn active">
    <span class="nav-icon">🗂️</span>
    <span>Precartón</span>
  </a>
  <button type="button" class="mobile-nav-btn" onclick="guardarPlanilla()">
    <span class="nav-icon">💾</span>
    <span>Guardar</span>
  </button>
</nav>
</body>
</html>
