name: Build Android APK (Web Alfas 2026)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 (Requerido por Capacitor Android / Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses (Pre-instalado en ubuntu-latest)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies & Run QA Security Tests
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Build Web Bundle & Sync Capacitor Android
        run: |
          npm run build:web
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp -f img/icons/p1_icon_3.png "$dir/ic_launcher.png" || true
              cp -f img/icons/p1_icon_3.png "$dir/ic_launcher_round.png" || true
              cp -f img/icons/p1_icon_3.png "$dir/ic_launcher_foreground.png" || true
            fi
          done

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web-Alfas-2026-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
